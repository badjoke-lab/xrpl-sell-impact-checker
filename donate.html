    <div class="donate-box">
      <code id="donate-addr">rsMuUUdLC1wxrJ2DvQnTrnKGRhVxoLrhEj</code>
      <button id="copy-donate" class="btn" type="button">Copy</button>
    </div>

<script>
(function(){
  const addr = document.getElementById("donate-addr").textContent.trim();
  const btn = document.getElementById("copy-donate");
  const st = document.getElementById("donate-status");

  function setStatus(msg, ok){
    st.textContent = msg;
    st.className = "donate-status " + (ok ? "ok" : "ng");
  }

  async function copyText(){
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(addr);
        setStatus("Copied.", true);
        return;
      }
      // fallback
      const ta = document.createElement("textarea");
      ta.value = addr;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      setStatus(ok ? "Copied." : "Copy failed.", ok);
    } catch (e) {
      setStatus("Copy failed.", false);
    }
  }

  btn.addEventListener("click", copyText);
})();
</script>
