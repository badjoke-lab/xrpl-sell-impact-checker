<body>
  <header class="page-header">
    <div class="page-header__row">
      <div class="page-header__brand" style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
        <img class="page-header__logo" src="/xsic_logo.png" alt="XRPL Sell Impact Checker logo" width="36" height="36" />
        <span class="page-header__title" style="font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; word-break: keep-all;">XRPL SELL IMPACT CHECKER</span>
      </div>
      <div
        class="lang-switch"
        role="group"
        aria-label="Language"
        data-i18n-aria-label="language.label"
      >
        <span class="lang-switch__label" data-i18n="language.label"></span>
        <button
          class="ghost-button lang-switch__button"
          type="button"
          data-lang-switch="en"
          aria-pressed="false"
        >
          EN
        </button>
        <button
          class="ghost-button lang-switch__button"
          type="button"
          data-lang-switch="ja"
          aria-pressed="false"
        >
          JA
        </button>
      </div>
    </div>
    <p class="page-header__catchcopy" data-i18n="header.tagline"></p>
    <nav class="site-nav" aria-label="Primary">
      <a href="/methods.html" data-i18n="nav.methods"></a>

  <main class="page">
    <h1 class="page__title" data-i18n="pages.donate.title"></h1>
    <p data-i18n="pages.donate.lede_short"></p>

    <div class="donate-box">
      <code id="donate-addr">rsMuUUdLC1wxrJ2DvQnTrnKGRhVxoLrhEj</code>
      <button id="copy-donate" class="btn" type="button" data-i18n="pages.donate.copy_button"></button>
    </div>

    <p class="donate-status" id="donate-status" aria-live="polite"></p>
  </main>

  <footer class="page-footer">

      <a href="/methods.html" data-i18n="nav.methods"></a>
      <a href="/faq.html" data-i18n="nav.faq"></a>
      <a href="/disclaimer.html" data-i18n="nav.disclaimer"></a>
      <a href="/credits.html" data-i18n="nav.credits"></a>
    </nav>
  </footer>

<script type="module">
  import { initI18nPage } from "/src/i18n/page.js";
  import { t } from "/src/i18n/index.js";

  const i18nReady = initI18nPage();
  const addressNode = document.getElementById("donate-addr");
  const button = document.getElementById("copy-donate");
  const status = document.getElementById("donate-status");

  const setStatus = (key, ok) => {
    status.textContent = t(key);
    status.className = `donate-status ${ok ? "ok" : "ng"}`;
  };

  const fallbackCopy = (text) => {
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(textarea);
    return ok;
  };

  const handleCopy = async () => {
    await i18nReady;
    const text = addressNode?.textContent?.trim();
    if (!text) {
      setStatus("pages.donate.address_unavailable", false);
      return;
    }

    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        setStatus("pages.donate.copy_success", true);
        return;
      }
      const ok = fallbackCopy(text);
      setStatus(ok ? "pages.donate.copy_success" : "pages.donate.copy_failed", ok);
    } catch (error) {
      setStatus("pages.donate.copy_failed", false);
    }
  };

  button.addEventListener("click", handleCopy);
</script>
</body>
</html>
