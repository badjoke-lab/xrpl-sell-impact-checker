name: Reliability Guardrails

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-cloudflare-scheduled-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject Cloudflare scheduled trigger configuration
        shell: bash
        run: |
          set -euo pipefail
          toml_matches="$(find . -type f -name 'wrangler*.toml' -not -path './node_modules/*' -not -path './.git/*' -print0 | xargs -0 -r grep -En '^[[:space:]]*\[[[:space:]]*triggers[[:space:]]*\][[:space:]]*$|^[[:space:]]*crons[[:space:]]*=' || true)"
          json_matches="$(find . -type f \( -name 'wrangler*.json' -o -name 'wrangler*.jsonc' \) -not -path './node_modules/*' -not -path './.git/*' -print0 | xargs -0 -r grep -En '"crons"[[:space:]]*:' || true)"
          if [ -n "${toml_matches}${json_matches}" ]; then
            echo "Cloudflare scheduled triggers are not allowed in XSIC configuration."
            printf '%s\n%s\n' "$toml_matches" "$json_matches"
            exit 1
          fi
          echo "No Cloudflare scheduled trigger configuration found."

  reliability-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run deterministic reliability baseline
        run: |
          node scripts/check_reliability_baseline.mjs
          node --check apps/sell-impact/precompute-summary-bridge.js
          node --check apps/sell-impact/precompute-freshness-bridge.js
          node scripts/check_sell_impact_contract.cjs
