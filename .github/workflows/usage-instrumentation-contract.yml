name: Usage Instrumentation Contract

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check fail-open usage instrumentation
        run: |
          node --check shared/usage-metrics-policy.js
          node --check shared/usage-metrics.js
          node --check shared/usage-sell-impact.js
          node --check functions/api/usage-event.js
          node scripts/check_usage_instrumentation_contract.mjs
