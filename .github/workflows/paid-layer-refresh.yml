name: Refresh paid data layers

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual refresh'
        required: false
        default: 'manual'
  repository_dispatch:
    types: [paid-layer-refresh]
  push:
    branches: [main]
    paths:
      - '.github/workflows/paid-layer-refresh.yml'

jobs:
  refresh-paid-layers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      XSIC_URL: https://xsic.badjoke-lab.com
    steps:
      - name: Refresh Sell Impact precompute
        run: |
          set -euo pipefail
          curl -fsSL "$XSIC_URL/api/precompute-popular-pairs?persist=1&amount=1000&limit=60" | tee /tmp/precompute.json
          python3 -c "import json,sys; p=json.load(open('/tmp/precompute.json')); assert p.get('ok') and p.get('persist') and int(p.get('count') or 0)>0"

      - name: Refresh Liquidity Pulse
        run: |
          set -euo pipefail
          curl -fsSL "$XSIC_URL/api/xrpl/amm-snapshot?pool=xrp-rlusd" | tee /tmp/liquidity.json
          python3 -c "import json,sys; p=json.load(open('/tmp/liquidity.json')); assert not p.get('error') and p.get('ts')"

      - name: Refresh Flow Alert snapshots
        run: |
          set -euo pipefail
          curl -fsSL "$XSIC_URL/api/xrpl/flow-snapshot?preset=exchanges&window=5m&persist=1" | tee /tmp/flow-exchanges-5m.json
          curl -fsSL "$XSIC_URL/api/xrpl/flow-snapshot?preset=exchanges&window=1h&persist=1" | tee /tmp/flow-exchanges-1h.json
          curl -fsSL "$XSIC_URL/api/xrpl/flow-snapshot?preset=whales&window=1h&persist=1" | tee /tmp/flow-whales-1h.json
          curl -fsSL "$XSIC_URL/api/xrpl/flow-snapshot?preset=ripple&window=24h&persist=1" | tee /tmp/flow-ripple-24h.json
          python3 -c "import json,glob; [(_ for _ in ()).throw(AssertionError(f)) for f in glob.glob('/tmp/flow-*.json') if not (json.load(open(f)).get('ok'))]"

      - name: Verify paid layer health
        run: |
          set -euo pipefail
          curl -fsSL "$XSIC_URL/api/health" | tee /tmp/health.json
          python3 -c "import json,sys; p=json.load(open('/tmp/health.json')); f=p.get('features') or {}; bad={k:(f.get(k) or {}).get('freshness') for k in ['sell_impact_precompute','liquidity_pulse','flow_alert'] if (f.get(k) or {}).get('freshness') not in {'fresh','aging'}}; assert not bad, bad"
