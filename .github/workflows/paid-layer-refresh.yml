name: Refresh paid data layers

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual refresh'
        required: false
        default: 'manual'
  repository_dispatch:
    types: [paid-layer-refresh]
  push:
    branches: [main]
    paths:
      - '.github/workflows/paid-layer-refresh.yml'

jobs:
  refresh-paid-layers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      XSIC_URL: https://xsic.badjoke-lab.com
    steps:
      - name: Refresh Sell Impact precompute
        run: |
          set -euo pipefail
          curl -fsSL "$XSIC_URL/api/precompute-popular-pairs?persist=1&amount=1000&limit=60" | tee /tmp/precompute.json
          python3 -c "import json,sys; p=json.load(open('/tmp/precompute.json')); assert p.get('ok') and p.get('persist') and int(p.get('count') or 0)>0"

      - name: Refresh Liquidity Pulse
        run: |
          set -euo pipefail
          curl -fsSL "$XSIC_URL/api/xrpl/amm-snapshot?pool=xrp-rlusd" | tee /tmp/liquidity.json
          python3 -c "import json,sys; p=json.load(open('/tmp/liquidity.json')); assert not p.get('error') and p.get('ts')"

      - name: Refresh Flow Alert snapshots
        run: |
          set -euo pipefail
          curl -fsSL "$XSIC_URL/api/xrpl/flow-snapshot?preset=exchanges&window=5m&persist=1" | tee /tmp/flow-exchanges-5m.json
          curl -fsSL "$XSIC_URL/api/xrpl/flow-snapshot?preset=exchanges&window=1h&persist=1" | tee /tmp/flow-exchanges-1h.json
          curl -fsSL "$XSIC_URL/api/xrpl/flow-snapshot?preset=whales&window=1h&persist=1" | tee /tmp/flow-whales-1h.json
          curl -fsSL "$XSIC_URL/api/xrpl/flow-snapshot?preset=ripple&window=24h&persist=1" | tee /tmp/flow-ripple-24h.json
          python3 -c "import json,glob; [(_ for _ in ()).throw(AssertionError(f)) for f in glob.glob('/tmp/flow-*.json') if not (json.load(open(f)).get('ok'))]"

      - name: Verify Exit Coverage API contract
        run: |
          set -euo pipefail
          curl -fsSL "$XSIC_URL/api/exit-coverage?preset=expanded" | tee /tmp/exit-coverage.json
          python3 -c "import json,sys; p=json.load(open('/tmp/exit-coverage.json')); s=p.get('summary') or {}; assert p.get('ok') and p.get('allRowsHaveSellImpactUrl') and s.get('dual')==2 and s.get('bookOnly')==1 and s.get('ammOnly')==1 and s.get('none')==2, p"

      - name: Verify Exit Coverage limited live endpoint
        run: |
          set -euo pipefail
          curl -fsSL "$XSIC_URL/api/exit-coverage-live?issuer=rhub8VRN55s94qWKDv6jmDy1pUykJzF3wq" | tee /tmp/exit-coverage-live.json
          python3 -c "import json,sys; p=json.load(open('/tmp/exit-coverage-live.json')); s=p.get('summary') or {}; assert p.get('ok') and p.get('mode')=='live' and p.get('allRowsHaveSellImpactUrl') and int(s.get('total') or 0)>0, p"

      - name: Verify Exit Coverage explicit live endpoint
        run: |
          set -euo pipefail
          curl -fsSL "$XSIC_URL/api/exit-coverage-live?issuer=rhub8VRN55s94qWKDv6jmDy1pUykJzF3wq&currency=USD" | tee /tmp/exit-coverage-live-explicit.json
          python3 -c "import json,sys; p=json.load(open('/tmp/exit-coverage-live-explicit.json')); s=p.get('summary') or {}; rows=p.get('rows') or []; assert p.get('ok') and p.get('mode')=='live' and p.get('key')=='limited-live-explicit' and p.get('allRowsHaveSellImpactUrl') and int(s.get('total') or 0)==1 and rows and rows[0].get('currency')=='USD', p"

      - name: Verify Route Compare API
        run: |
          set -euo pipefail
          curl -fsSL "$XSIC_URL/api/route-compare?currency=USD&issuer=rhub8VRN55s94qWKDv6jmDy1pUykJzF3wq&amount=1000&limit=60" | tee /tmp/route-compare.json
          python3 -c "import json,sys; p=json.load(open('/tmp/route-compare.json')); routes=p.get('routes') or []; assert p.get('ok') and p.get('source')=='bounded-route-compare' and len(routes)==2 and p.get('rankedRouteIds') and p.get('sellImpactUrl') and p.get('limits',{}).get('allPairScanning') is False, p"

      - name: Verify paid layer health
        run: |
          set -euo pipefail
          curl -fsSL "$XSIC_URL/api/health" | tee /tmp/health.json
          python3 -c "import json,sys; p=json.load(open('/tmp/health.json')); f=p.get('features') or {}; required=['sell_impact_precompute','liquidity_pulse','flow_alert','exit_coverage','route_compare']; missing=[k for k in required if k not in f]; assert not missing, missing; bad={k:(f.get(k) or {}).get('freshness') for k in required if (f.get(k) or {}).get('freshness') not in {'fresh','aging'}}; assert not bad, bad; ex=f.get('exit_coverage') or {}; assert ex.get('four_state_contract_ready') and ex.get('all_rows_have_sell_impact_url'), ex; rc=f.get('route_compare') or {}; assert rc.get('contract_ready') and rc.get('sell_impact_handoff_ready') and rc.get('limits',{}).get('allPairScanning') is False, rc"
