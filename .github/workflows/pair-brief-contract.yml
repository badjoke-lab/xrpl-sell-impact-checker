name: Pair Brief Contract

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Pair Brief aggregate API
        run: |
          node --check functions/api/pair-brief.js
          node scripts/check_pair_brief_contract.mjs
