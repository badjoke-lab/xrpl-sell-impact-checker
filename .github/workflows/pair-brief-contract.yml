name: Pair Brief Contract

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Check Pair Brief syntax
        run: node --check functions/api/pair-brief.js
      - name: Check Pair Brief complete and partial contracts
        run: node scripts/check_pair_brief_contract.mjs
