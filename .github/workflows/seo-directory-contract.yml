name: SEO Directory Contract

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check SEO and public routes
        run: |
          node scripts/audit-seo.mjs
          node scripts/check_directory_routes.cjs
