name: Health Ops Contract

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check health and operations contracts
        run: |
          node --check functions/api/health.js
          node --check functions/api/health-watchers.js
          node scripts/check_health_ops_contract.cjs
