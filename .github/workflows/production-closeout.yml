name: Production Closeout Smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Smoke public XSIC routes and APIs
        env:
          XSIC_BASE_URL: https://xsic.badjoke-lab.com
          XSIC_SMOKE_ATTEMPTS: '4'
          XSIC_SMOKE_RETRY_MS: '10000'
          XSIC_SMOKE_TIMEOUT_MS: '15000'
        run: node scripts/smoke_production.mjs
