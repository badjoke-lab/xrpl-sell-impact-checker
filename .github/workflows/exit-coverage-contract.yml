name: Exit Coverage Contract

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Exit Coverage runtime
        run: |
          node --check functions/api/exit-coverage-live.js
          node --check functions/api/exit_coverage_source.cjs
          node --check functions/api/exit_coverage_live_handler.cjs
          node --check apps/exit-coverage-map/exit-coverage-runtime.js
          node --check apps/exit-coverage-map/exit-coverage-api-bridge.js
          node scripts/check_exit_coverage_contract.cjs
