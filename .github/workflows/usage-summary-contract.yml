name: Usage Summary Contract

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check usage and operations separation
        run: |
          node --check functions/api/usage-summary.js
          node --check scripts/report_usage_operations.mjs
          node scripts/check_usage_summary_contract.mjs
