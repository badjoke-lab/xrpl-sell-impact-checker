name: Flow Alert Contract

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Flow Alert runtime
        run: |
          node --check apps/flow-alert/flow-alert.js
          node --check apps/flow-alert/flow-alert-runtime.js
          node scripts/check_flow_alert_contract.cjs
