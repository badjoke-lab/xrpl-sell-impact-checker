name: Proof Anchor Contract

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Proof Anchor Checker
        run: |
          node --check functions/api/proof_anchor_checker.cjs
          node --check functions/api/proof-anchor.js
          node --check apps/proof-anchor-checker/proof-anchor-checker.js
          node scripts/check_proof_anchor_contract.cjs
