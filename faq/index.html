<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FAQ | XRPL Sell Impact Checker</title>
    <meta
      name="description"
      content="Frequently asked questions about XSIC, including XRP-only handling and data freshness."
    />
    <meta property="og:title" content="FAQ | XRPL Sell Impact Checker" />
    <meta
      property="og:description"
      content="Frequently asked questions about XSIC, including XRP-only handling and data freshness."
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app page">
      <header class="app__header">
        <div class="app__header-top">
          <div>
            <p class="eyebrow" data-i18n="app.eyebrow"></p>
            <h1 data-i18n="app.title"></h1>
          </div>
          <div
            class="lang-switch"
            role="group"
            aria-label="Language"
            data-i18n-aria-label="language.label"
          >
            <span class="lang-switch__label" data-i18n="language.label"></span>
            <button
              class="ghost-button lang-switch__button"
              type="button"
              data-lang-switch="en"
              aria-pressed="false"
            >
              EN
            </button>
            <button
              class="ghost-button lang-switch__button"
              type="button"
              data-lang-switch="ja"
              aria-pressed="false"
            >
              JA
            </button>
          </div>
        </div>
        <nav class="site-nav" aria-label="Primary">
          <a href="/" data-i18n="nav.home"></a>
          <a href="/methods" data-i18n="nav.methods"></a>
          <a href="/faq" data-i18n="nav.faq"></a>
          <a href="/disclaimer" data-i18n="nav.disclaimer"></a>
          <a href="/credits" data-i18n="nav.credits"></a>
          <a href="/donate" data-i18n="nav.donate"></a>
        </nav>
      </header>

      <main class="page__content">
        <section class="card">
          <h2 class="page__title" data-i18n="pages.faq.title"></h2>
          <p class="page__lede" data-i18n="pages.faq.lede"></p>
        </section>

        <section class="card">
          <h3 data-i18n="pages.faq.q1_title"></h3>
          <p data-i18n="pages.faq.q1_body"></p>
        </section>

        <section class="card">
          <h3 data-i18n="pages.faq.q2_title"></h3>
          <p data-i18n="pages.faq.q2_body"></p>
        </section>

        <section class="card">
          <h3 data-i18n="pages.faq.q3_title"></h3>
          <p data-i18n="pages.faq.q3_body"></p>
        </section>

        <section class="card">
          <h3 data-i18n="pages.faq.q4_title"></h3>
          <p data-i18n="pages.faq.q4_body"></p>
        </section>

        <section class="card">
          <h3 data-i18n="pages.faq.q5_title"></h3>
          <p data-i18n="pages.faq.q5_body"></p>
        </section>
      </main>

      <footer class="site-footer">
        <div class="site-footer__brand">
          <p class="site-footer__title" data-i18n="footer.brand"></p>
          <p class="site-footer__note" data-i18n="footer.note"></p>
        </div>
        <nav class="site-footer__links" aria-label="Footer">
          <a href="/methods" data-i18n="nav.methods"></a>
          <a href="/faq" data-i18n="nav.faq"></a>
          <a href="/disclaimer" data-i18n="nav.disclaimer"></a>
          <a href="/credits" data-i18n="nav.credits"></a>
          <a href="/donate" data-i18n="nav.donate"></a>
        </nav>
      </footer>
    </div>
    <script type="module" src="/src/i18n/page-init.js"></script>
  </body>
</html>
