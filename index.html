<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="app.title"></title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app__header">
        <div>
          <p class="eyebrow" data-i18n="app.eyebrow"></p>
          <h1 data-i18n="app.tagline"></h1>
        </div>
        <button class="ghost-button" type="button" data-i18n="header.connect_wallet"></button>
      </header>

      <main class="app__main">
        <section class="card" aria-labelledby="inputs-heading">
          <div class="card__header">
            <h2 id="inputs-heading" data-i18n="sections.inputs"></h2>
            <div class="pill-group">
              <span class="pill pill--active" data-i18n="modes.simple"></span>
              <span class="pill" data-i18n="modes.advanced"></span>
            </div>
          </div>

          <div class="grid two-column">
            <label class="field">
              <span class="field__label" data-i18n="fields.currency.label"></span>
              <input
                id="currency-input"
                type="text"
                data-i18n-placeholder="fields.currency.placeholder"
                aria-describedby="currency-error"
              />
              <p class="field__error" id="currency-error" data-error-for="currency" hidden></p>
            </label>
            <label class="field">
              <span class="field__label" data-i18n="fields.issuer.label"></span>
              <input
                id="issuer-input"
                type="text"
                data-i18n-placeholder="fields.issuer.placeholder"
                aria-describedby="issuer-help issuer-error"
              />
              <p class="field__help" id="issuer-help" data-i18n="fields.issuer.helper"></p>
              <p class="field__error" id="issuer-error" data-error-for="issuer" hidden></p>
            </label>
            <label class="field">
              <span class="field__label" data-i18n="fields.amount.label"></span>
              <input
                id="sell-amount-input"
                type="number"
                min="0"
                step="any"
                data-i18n-placeholder="fields.amount.placeholder"
                aria-describedby="amount-error"
              />
              <p class="field__error" id="amount-error" data-error-for="amount" hidden></p>
            </label>
            <label class="field">
              <span class="field__label" data-i18n="fields.orderbook_limit.label"></span>
              <input
                id="limit-input"
                type="number"
                min="1"
                step="1"
                value="50"
                data-i18n-placeholder="fields.orderbook_limit.placeholder"
                aria-describedby="limit-error limit-note"
              />
              <p class="field__error" id="limit-error" data-error-for="limit" hidden></p>
              <p class="field__note" id="limit-note" hidden></p>
            </label>
          </div>

          <details class="advanced">
            <summary data-i18n="sections.advanced_controls"></summary>
            <div class="grid two-column">
              <label class="field">
                <span class="field__label" data-i18n="fields.impact_threshold.label"></span>
                <select id="impact-threshold-select" aria-describedby="impact-threshold-help">
                  <option value="1" data-i18n="fields.impact_threshold.option_1"></option>
                  <option value="2" data-i18n="fields.impact_threshold.option_2"></option>
                  <option value="5" data-i18n="fields.impact_threshold.option_5" selected></option>
                  <option value="10" data-i18n="fields.impact_threshold.option_10"></option>
                  <option value="20" data-i18n="fields.impact_threshold.option_20"></option>
                </select>
                <p
                  class="field__help"
                  id="impact-threshold-help"
                  data-i18n="fields.impact_threshold.helper"
                ></p>
              </label>
              <label class="field">
                <span class="field__label" data-i18n="fields.fiat_currency.label"></span>
                <select id="fiat-currency-select" aria-describedby="fiat-currency-help">
                  <option value="JPY" data-i18n="fields.fiat_currency.option_jpy" selected></option>
                  <option value="USD" data-i18n="fields.fiat_currency.option_usd"></option>
                </select>
                <p
                  class="field__help"
                  id="fiat-currency-help"
                  data-i18n="fields.fiat_currency.helper"
                ></p>
              </label>
            </div>
          </details>

          <div class="actions">
            <button class="secondary-button" type="button" id="try-example" data-i18n="actions.try_example"></button>
            <p class="field__help" data-i18n="actions.try_example_note"></p>
            <button class="primary-button" type="button" data-i18n="actions.estimate"></button>
            <p class="error-banner" hidden></p>
            <p class="status" data-i18n="status.waiting"></p>
            <p class="status-endpoint" hidden></p>
          </div>
        </section>

        <section class="grid two-column">
          <article class="card" aria-labelledby="result-summary">
            <div class="card__header">
              <h2 id="result-summary" data-i18n="sections.results_summary"></h2>
            </div>
            <div class="result-stack">
              <div class="result-row">
                <p class="label" data-i18n="results.sellability.label"></p>
                <p class="value" data-result="sellability" data-i18n="common.placeholder"></p>
              </div>
              <div class="result-row">
                <p class="label" data-i18n="results.receive.label"></p>
                <p class="value" data-result="receive" data-i18n="common.placeholder"></p>
                <p class="subvalue" data-i18n="results.receive.fiat_pending"></p>
              </div>
              <div class="result-row">
                <p class="label" data-i18n="results.slippage.label"></p>
                <p class="value" data-result="slippage" data-i18n="common.placeholder"></p>
                <p class="help" data-result="slippage-help" data-i18n="results.slippage.help"></p>
              </div>
            </div>
            <p class="why-line" data-result="why"></p>
            <p class="warning-banner" data-result="warning" hidden></p>
          </article>

          <article class="card" aria-labelledby="result-details">
            <div class="card__header">
              <h2 id="result-details" data-i18n="sections.execution_details"></h2>
            </div>
            <ul class="list">
              <li>
                <span data-i18n="details.order_count"></span>:
                <span data-i18n="common.placeholder"></span>
              </li>
              <li>
                <span data-i18n="details.best_price"></span>:
                <span data-i18n="common.placeholder"></span>
              </li>
              <li>
                <span data-i18n="details.worst_price"></span>:
                <span data-i18n="common.placeholder"></span>
              </li>
            </ul>
          </article>
        </section>

        <section class="grid two-column">
          <article class="card" aria-labelledby="graph-depth">
            <div class="card__header">
              <h2 id="graph-depth" data-i18n="sections.depth_curve"></h2>
            </div>
            <div class="graph-placeholder" data-i18n="graphs.placeholder"></div>
          </article>

          <article class="card" aria-labelledby="graph-impact">
            <div class="card__header">
              <h2 id="graph-impact" data-i18n="sections.impact_curve"></h2>
            </div>
            <div class="graph-placeholder" data-i18n="graphs.placeholder"></div>
          </article>
        </section>

        <section class="card" aria-labelledby="faq-heading">
          <div class="card__header">
            <h2 id="faq-heading" data-i18n="sections.faq"></h2>
          </div>
          <div class="stack">
            <p>
              <strong data-i18n="faq.q1"></strong>
              <span data-i18n="faq.a1"></span>
            </p>
            <p>
              <strong data-i18n="faq.q2"></strong>
              <span data-i18n="faq.a2"></span>
            </p>
          </div>
        </section>

        <section class="card" aria-labelledby="disclaimer-heading">
          <div class="card__header">
            <h2 id="disclaimer-heading" data-i18n="sections.disclaimer"></h2>
          </div>
          <p data-i18n="disclaimer.text"></p>
        </section>

        <section class="card" aria-labelledby="sources-heading">
          <div class="card__header">
            <h2 id="sources-heading" data-i18n="sections.sources"></h2>
          </div>
          <ul class="list">
            <li data-i18n="sources.xrpl"></li>
            <li data-i18n="sources.trades"></li>
            <li data-i18n="sources.feeds"></li>
          </ul>
        </section>
      </main>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
