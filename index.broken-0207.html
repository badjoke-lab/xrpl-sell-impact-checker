<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title data-i18n="app.title"></title>
    <meta
      name="description"
      data-i18n-content="app.description"
      content="Estimate sell impact and receive amounts before you trade."
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="canonical" href="https://xsic.badjoke-lab.com/">
  <meta property="og:url" content="https://xsic.badjoke-lab.com/">
  <meta property="og:site_name" content="XSIC">
  <meta property="og:type" content="website">
  <meta property="og:title" content="XRPL Sell Impact Checker (XSIC)">
  <meta property="og:description" content="Estimate sell impact and receive amounts before you trade.">
  <meta property="og:image" content="https://xsic.badjoke-lab.com/xsic_logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="XRPL Sell Impact Checker (XSIC)">
  <meta name="twitter:description" content="Estimate sell impact and receive amounts before you trade.">
  <meta name="twitter:image" content="https://xsic.badjoke-lab.com/xsic_logo.png">
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0D84H0D66W"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-0D84H0D66W');
  </script>
</head>
  <body>
    <noscript><p class="error-banner">JavaScript is required to use this tool.</p></noscript>
    <div class="app">
      <p class="error-banner" id="i18n-error-banner" hidden></p>
      <header class="app__header">
        <div class="app__header-top">
          <a href="/" class="brand-link" aria-label="Home"><div class="app__brand" style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
            <img class="app__logo" src="/xsic_logo.png" alt="XRPL Sell Impact Checker logo" width="36" height="36" />
            <h1 class="app__title" style="word-break: keep-all;">XRPL SELL IMPACT CHECKER</h1>
          </div></a>
          <button
            class="ghost-button"
            type="button"
            data-i18n="header.wallet_not_required"
            hidden
          ></button>
          <div
            class="lang-switch"
            role="group"
            aria-label="Language"
            data-i18n-aria-label="language.label"
          >
            <span class="lang-switch__label" data-i18n="language.label"></span>
            <button
              class="ghost-button lang-switch__button"
              type="button"
              data-lang-switch="en"
              aria-pressed="false"
            >
              EN
            </button>
            <button
              class="ghost-button lang-switch__button"
              type="button"
              data-lang-switch="ja"
              aria-pressed="false"
            >
              JA
            </button>
          </div>
        </div>
        <p class="app__catchcopy" data-i18n="header.tagline"></p>
        <nav class="site-nav" aria-label="Primary">
          <a href="/methods/">Methods</a>
          <a href="/faq/">FAQ</a>
          <a href="/disclaimer/">Disclaimer</a>
          <a href="/credits/">Credits</a>
          <a href="/donate/">Donate</a>
          <a href="https://docs.google.com/forms/d/e/1FAIpQLScdv3WFVHmQO_mz-p4_HJv1RyJItghrG6A0SGQ5ec4R2NBNOw/viewform?usp=pp_url&entry.148248220=XSIC" target="_blank" rel="noopener" data-i18n="nav.contact"></a>
        </nav>
      </header>

      <main class="app__main">
        <div id="mobile-jump" class="mobile-jump" aria-label="Jump">
          <a class="mobile-jump__btn" href="#inputs-section" data-i18n="mobile.jump_inputs"></a>
          <a class="mobile-jump__btn" href="#results-section" data-i18n="mobile.jump_results"></a>
        </div>
<section class="card" id="inputs-section" aria-labelledby="inputs-heading">
          <div class="card__header">
            <h2 id="inputs-heading" data-i18n="sections.inputs"></h2>
            <div class="pill-group">
              <span class="pill pill--active" data-i18n="modes.simple"></span>
              <span class="pill" data-i18n="modes.advanced"></span>
            </div>
          </div>

          <div class="grid two-column">
            <label class="field field--suggestions">
              <span class="field__label" data-i18n="fields.currency.label"></span>
              <input
                id="currency-input"
                type="text"
                data-i18n-placeholder="fields.currency.placeholder"
                aria-describedby="currency-error"
                autocomplete="off"
              />
              <ul id="token-suggestions" class="suggestions" role="listbox" hidden></ul>

              <p class="field__error" id="currency-error" data-error-for="currency" hidden></p>
            </label>
            <label class="field">
              <span class="field__label" data-i18n="fields.issuer.label"></span>
              <input
                id="issuer-input"
                type="text"
                data-i18n-placeholder="fields.issuer.placeholder"
                aria-describedby="issuer-help issuer-error"
              />
              <p class="field__help" id="issuer-help" data-i18n="fields.issuer.helper"></p>
              <p class="field__error" id="issuer-error" data-error-for="issuer" hidden></p>
            </label>
            <label class="field">
              <span class="field__label" data-i18n="fields.amount.label"></span>
              <input
                id="sell-amount-input"
                type="number"
                min="0"
                step="any"
                data-i18n-placeholder="fields.amount.placeholder"
                aria-describedby="amount-error"
              />
              <p class="field__error" id="amount-error" data-error-for="amount" hidden></p>
            </label>
            
            <label class="field">
              <span class="field__label" data-i18n="fields.orderbook_limit.label"></span>
              <input
                id="limit-input"
                type="number"
                min="1"
                step="1"
                value="50"
                data-i18n-placeholder="fields.orderbook_limit.placeholder"
                aria-describedby="limit-error limit-note"
              />
              <p class="field__error" id="limit-error" data-error-for="limit" hidden></p>
              <p class="field__note" id="limit-note" hidden></p>
            </label>
          </div>

          <details class="advanced">
            <summary data-i18n="sections.advanced_controls"></summary>
            <div class="grid two-column">
              <label class="field">
                <span class="field__label" data-i18n="fields.impact_threshold.label"></span>
                <select id="impact-threshold-select" aria-describedby="impact-threshold-help">
                  <option value="1" data-i18n="fields.impact_threshold.option_1"></option>
                  <option value="2" data-i18n="fields.impact_threshold.option_2"></option>
                  <option value="5" data-i18n="fields.impact_threshold.option_5" selected></option>
                  <option value="10" data-i18n="fields.impact_threshold.option_10"></option>
                  <option value="20" data-i18n="fields.impact_threshold.option_20"></option>
                </select>
                <p
                  class="field__help"
                  id="impact-threshold-help"
                  data-i18n="fields.impact_threshold.helper"
                ></p>
              </label>
              <label class="field">
                <span class="field__label" data-i18n="fields.thin_cutoff.label"></span>
                <input
                  id="thin-cutoff-input"
                  type="number"
                  min="0"
                  max="100"
                  step="1"
                  value="20"
                  data-i18n-placeholder="fields.thin_cutoff.placeholder"
                  aria-describedby="thin-cutoff-help"
                />
                <p
                  class="field__help"
                  id="thin-cutoff-help"
                  data-i18n="fields.thin_cutoff.helper"
                ></p>
              </label>
              <label class="field">
                <span class="field__label" data-i18n="fields.fiat_currency.label"></span>
                <select id="fiat-currency-select" aria-describedby="fiat-currency-help">
                  <option value="USD" data-i18n="fields.fiat_currency.option_usd" selected></option>
                  <option value="JPY" data-i18n="fields.fiat_currency.option_jpy"></option>
                </select>
                <p
                  class="field__help"
                  id="fiat-currency-help"
                  data-i18n="fields.fiat_currency.helper"
                ></p>
              </label>
            </div>
          </details>

          <div class="actions">
            <button class="secondary-button" type="button" id="try-example" data-i18n="actions.try_example">Try example</button>
            <p class="field__help" data-i18n="actions.try_example_note"></p>
            <p class="status status--notice" id="example-status" hidden></p>
            <button class="secondary-button" type="button" id="reset-inputs" data-i18n="actions.reset">Reset</button>
            <button class="secondary-button" type="button" id="copy-link" data-i18n="actions.copy_link">Copy link</button>
            <p class="status status--notice" id="share-load-note" data-i18n="status.loaded_from_link" hidden></p>
            <p class="status status--success" id="share-toast" aria-live="polite" hidden></p>
            <button class="primary-button" type="button" data-i18n="actions.estimate">Estimate</button>
            <div class="progress-bar" id="estimate-progress" role="progressbar" aria-label="Estimating" hidden>
              <span class="progress-bar__fill"></span>
            </div>
            <p class="error-banner" hidden></p>
            <p class="status" data-i18n="status.waiting"></p>
            <p class="status-endpoint" hidden></p>
          </div>
        </section>


        <section id="results-section" class="results" aria-label="Results">

        
<nav class="results-tabs" aria-label="Results tabs" role="tablist" aria-label="Results tabs">
  <a class="tab" href="#summary-block" data-tab-target="#summary-block" role="tab" data-tab="summary" aria-selected="false">Summary</a>
  <a class="tab" href="#details-block" data-tab-target="#details-block" role="tab" data-tab="details" aria-selected="false">Details</a>
  <a class="tab" href="#debug-panel"  data-tab-target="#debug-panel" role="tab" data-tab="debug" aria-selected="false">Debug</a>
</nav>

<section id="charts-block" class="grid two-column">
          <details class="card" data-mobile-details="1" open aria-labelledby="graph-depth">
            <summary class="card__header">
              <h2 id="graph-depth" data-i18n="sections.depth_curve"></h2>
            </summary>
<p class="chart__help" data-i18n="graphs.depth.helper"></p>
            <div class="chart" data-chart="depth">
              <svg
                id="depth-chart"
                class="chart__svg"
                viewBox="0 0 320 200"
                preserveAspectRatio="none"
                data-i18n-aria-label="graphs.depth.aria_label"
                role="img"
              ></svg>
            </div>
            <p class="chart__note" data-result="depth-note" hidden></p>
            <p class="chart__summary" data-result="depth-summary"></p>
          </details>

                    <details class="card" data-mobile-details="1" open aria-labelledby="graph-impact">
            <summary class="card__header">
              <h2 id="graph-impact" data-i18n="sections.impact_curve"></h2>
            </summary>
<p class="chart__help" data-i18n="graphs.impact.helper"></p>
            <div class="chart" data-chart="impact">
              <svg
                id="impact-chart"
                class="chart__svg"
                viewBox="0 0 320 200"
                preserveAspectRatio="none"
                data-i18n-aria-label="graphs.impact.aria_label"
                role="img"
              ></svg>
            </div>
            <p class="chart__note" data-result="impact-note" hidden></p>
            <p class="chart__summary" data-result="impact-summary"></p>
          </details>
        </section>

        </section>

        <section class="card" aria-labelledby="faq-heading">
          <div class="card__header">
            <h2 id="faq-heading" data-i18n="sections.faq"></h2>
          </div>
          <div class="stack">
            <p>
              <strong data-i18n="faq.q1"></strong>
              <span data-i18n="faq.a1"></span>
            </p>
            <p>
              <strong data-i18n="faq.q2"></strong>
              <span data-i18n="faq.a2"></span>
            </p>
          </div>
        </section>

        <section class="card" aria-labelledby="disclaimer-heading">
          <div class="card__header">
            <h2 id="disclaimer-heading" data-i18n="sections.disclaimer"></h2>
          </div>
          <p data-i18n="disclaimer.text"></p>
        </section>

        <section class="card" aria-labelledby="sources-heading">
          <div class="card__header">
            <h2 id="sources-heading" data-i18n="sections.sources"></h2>
          </div>
          <ul class="list">
            <li data-i18n="sources.xrpl"></li>
            <li data-i18n="sources.trades"></li>
            <li data-i18n="sources.feeds"></li>
          </ul>
        </section>
      </main>

      <footer class="site-footer">
        <div class="site-footer__brand">
          <a class="site-footer__title" href="https://badjoke-lab.com/" target="_blank" rel="noopener" data-i18n="footer.brand"></a>
          <p class="site-footer__note" data-i18n="footer.note"></p>
        </div>
        <nav class="site-footer__links" aria-label="Footer">
          <a href="/methods/">Methods</a>
          <a href="/faq/">FAQ</a>
          <a href="/disclaimer/">Disclaimer</a>
          <a href="/credits/">Credits</a>
          <a href="/donate/">Donate</a>
        </nav>
      </footer>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
