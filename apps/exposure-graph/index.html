<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exposure Graph — XSIC</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/favicon.png" />
  </head>
  <body data-nav-key="apps">
    <div class="app page console-page">
      <header class="app__header global-header">
        <div class="app__header-top">
          <a href="/" class="brand-link"><div class="app__brand"><img class="app__logo" src="/xsic_logo.png" alt="XSIC logo" width="36" height="36" /><h1 class="app__title">XSIC</h1></div></a>
          <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="global-nav">≡</button>
          <button class="secondary-button lite-mode-toggle" type="button" data-lite-mode-toggle aria-pressed="false">Lite mode: OFF</button>
          <div data-global-nav></div>
        </div>
      </header>
      <main class="page__content">
        <section class="card">
          <h2 class="page__title">Exposure Graph</h2>
          <p class="page__lede">Coming soon. Shared states are ready for this app.</p>
        </section>
        <section class="card" aria-label="Shared UI state mount"><div class="ui-mount" data-ui-mount="exposure-graph"></div></section>
      </main>
      <div data-global-footer></div>
    </div>
    <script src="/shared/ui-kit.js"></script>
    <script src="/shared/nav.js"></script>
    <script>
      window.XSICUiKit?.renderErrorState('[data-ui-mount="exposure-graph"]', {
        title: 'Demo error state',
        body: 'Graph module is not connected yet. This is a reusable error container.',
        onRetry: () => window.XSICUiKit?.renderLoadingState('[data-ui-mount="exposure-graph"]', { label: 'Retrying…' }),
      });
    </script>
  </body>
</html>
