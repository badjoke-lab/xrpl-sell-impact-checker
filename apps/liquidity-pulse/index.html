<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liquidity Pulse — XSIC</title>
    <meta
      name="description"
      content="Visualize XRPL AMM and DEX liquidity pulse in near real-time with lightweight state-aware UI."
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/favicon.png" />
  </head>
  <body data-nav-key="apps">
    <div class="app page console-page liquidity-pulse-page">
      <header class="app__header global-header">
        <div class="app__header-top">
          <a href="/" class="brand-link" aria-label="Home">
            <div class="app__brand">
              <img class="app__logo" src="/xsic_logo.png" alt="XSIC logo" width="36" height="36" />
              <h1 class="app__title">Liquidity Pulse — XSIC</h1>
            </div>
          </a>
          <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="global-nav">≡</button>
          <button class="secondary-button lite-mode-toggle" type="button" data-lite-mode-toggle aria-pressed="false">Lite mode: OFF</button>
          <div data-global-nav></div>
        </div>
      </header>

      <main class="page__content liquidity-pulse" aria-live="polite">
        <section class="card">
          <h2 class="page__title">Liquidity Pulse</h2>
          <p class="page__lede">Dummy rendering is now active. API integration comes next.</p>
        </section>
        <section class="card" aria-label="Shared UI state mount"><div class="ui-mount" data-ui-mount="liquidity-pulse"></div></section>
      </main>
      <div data-global-footer></div>
    </div>
    <script src="/shared/ui-kit.js"></script>
    <script src="/shared/nav.js"></script>
    <script>
      const mount = document.querySelector('[data-ui-mount="liquidity-pulse"]');
      window.XSICUiKit?.renderLoadingState(mount, { label: 'Rendering Liquidity Pulse demo…' });
      window.setTimeout(() => {
        window.XSICUiKit?.renderEmptyState(mount, {
          title: 'Liquidity Pulse demo view',
          body: window.XSICUiKit?.getLiteMode()
            ? 'Lite mode is ON: low-intensity placeholders are enabled.'
            : 'Lite mode is OFF: standard placeholders are enabled.',
          actions: [{ label: 'Back to Apps', href: '/apps/' }],
        });
      }, 600);
    </script>
  </body>
</html>
